<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- TODO(launch): remove this noindex once the content is final. -->
    <meta name="robots" content="noindex" />

    <title>Emanuele d'Ambrosio</title>
    <meta name="description" content="" data-i18n-meta="seo.description" />

    <link rel="alternate" hreflang="it" href="./?lang=it" />
    <link rel="alternate" hreflang="en" href="./?lang=en" />
    <link rel="alternate" hreflang="x-default" href="./" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Emanuele d'Ambrosio" />
    <meta property="og:description" content="" data-i18n-meta="seo.description" />

    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="#top" aria-label="Emanuele d'Ambrosio">ED</a>
      <nav class="lang" aria-label="Language switch">
        <button type="button" data-lang="it">IT</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button type="button" data-lang="en">EN</button>
      </nav>
    </header>

    <!-- SIDEBAR (wide screens only): who, where you are, the two actions. -->
    <aside class="side">
      <a class="side-id" href="#top">
        <img class="side-portrait" src="./assets/img/emanuele-portrait.jpg" alt="" width="72" height="72" />
        <span class="side-name" data-i18n="hero.name"></span>
      </a>
      <p class="side-role" data-i18n="hero.eyebrow"></p>
      <p class="side-tagline" data-i18n="hero.tagline"></p>
      <nav class="side-nav" aria-label="Sezioni">
        <a href="#about" data-i18n="about.kicker"></a>
        <a href="#book" data-i18n="book.kicker"></a>
        <a href="#novita" data-i18n="courses.kicker"></a>
        <a href="#story" data-i18n="story.kicker"></a>
        <a href="#athletes" data-i18n="wins.kicker"></a>
        <a href="#education" data-i18n="credentials.kicker"></a>
        <a href="#experience" data-i18n="experience.kicker"></a>
        <a href="#services" data-i18n="services.kicker"></a>
        <a href="#teaching" data-i18n="teaching.kicker"></a>
        <a href="#cpd" data-i18n="cpd.kicker"></a>
        <a href="#news" data-i18n="news.kicker"></a>
        <a href="#contact" data-i18n="contact.kicker"></a>
      </nav>
      <div class="side-cta">
        <a class="btn btn-ghost btn-bodygon" href="https://bodygon.com" target="_blank" rel="noopener noreferrer" aria-label="Bodygon">
          <img src="./assets/img/bodygon-logo.svg" alt="Bodygon" width="96" height="19" />
        </a>
        <a class="btn btn-primary" data-link="book" data-i18n="hero.ctaBook" href="#"></a>
        <a class="btn btn-ghost" href="#contact" data-i18n="hero.ctaContact"></a>
      </div>
      <nav class="lang side-lang" aria-label="Language switch">
        <button type="button" data-lang="it">IT</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button type="button" data-lang="en">EN</button>
      </nav>
    </aside>

    <main id="top">
      <!-- HERO -->
      <section class="hero">
        <img class="hero-portrait" src="./assets/img/emanuele-portrait.jpg" alt="Emanuele d'Ambrosio" width="168" height="168" />
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 class="hero-name" data-i18n="hero.name"></h1>
        <p class="hero-tagline" data-i18n="hero.tagline"></p>
        <p class="hero-intro" data-i18n="hero.intro"></p>
        <div class="cta-row">
          <a class="btn btn-primary" data-link="book" data-i18n="hero.ctaBook" href="#"></a>
          <a class="btn btn-ghost" href="#contact" data-i18n="hero.ctaContact"></a>
        </div>
      </section>

      <!-- ABOUT -->
      <section class="section" id="about">
        <p class="kicker" data-i18n="about.kicker"></p>
        <h2 class="section-title" data-i18n="about.title"></h2>
        <div class="about-grid">
          <div class="about-text">
            <p data-i18n="about.p1"></p>
            <p data-i18n="about.p2"></p>
          </div>
          <ul class="highlights">
            <li data-i18n="about.h1"></li>
            <li data-i18n="about.h2"></li>
            <li><span data-i18n="about.h3"></span> <a class="hl-logo" href="https://bodygon.com" target="_blank" rel="noopener noreferrer" aria-label="Bodygon"><img src="./assets/img/bodygon-logo.svg" alt="Bodygon" width="77" height="15" /></a></li>
            <li data-i18n="about.h4"></li>
          </ul>
        </div>
      </section>

      <!-- BOOK -->
      <section class="section book-band" id="book">
        <p class="kicker" data-i18n="book.kicker"></p>
        <h2 class="section-title" data-i18n="book.title"></h2>
        <p class="book-subtitle" data-i18n="book.subtitle"></p>
        <p class="book-text" data-i18n="book.text"></p>
        <p class="book-meta" data-i18n="book.meta"></p>
        <p class="publisher">
          <span class="publisher-label" data-i18n="book.publisher"></span>
          <a class="logo-chip" data-link="publisher" href="#" target="_blank" rel="noopener noreferrer" aria-label="Calzetti & Mariucci">
            <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 160 70%27/%3E" data-src="./assets/img/calzetti-mariucci.svg" alt="Calzetti & Mariucci" loading="lazy" width="160" height="70" />
          </a>
        </p>
        <a class="btn btn-primary" data-link="book" data-i18n="book.cta" href="#"></a>
        <figure class="book-figure">
          <img data-i18n-src="book.image" data-i18n-alt="book.imageAlt" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 800 1200%27/%3E" data-src="./assets/img/book-it.jpg" alt="Il libro «Le espressioni della forza» di Emanuele d'Ambrosio" loading="lazy" decoding="async" width="800" height="1200" />
        </figure>
      </section>

      <!-- WHAT'S NEW: the Bodygon courses Emanuele teaches -->
      <section class="section courses-band" id="novita">
        <p class="kicker" data-i18n="courses.kicker"></p>
        <h2 class="section-title" data-i18n="courses.title"></h2>
        <p class="courses-intro" data-i18n="courses.intro"></p>
        <div class="course-cards">
          <article class="course-card">
            <div class="carousel" data-carousel="coursePhotos" role="group" aria-roledescription="carousel">
              <div class="carousel-track"></div>
              <button type="button" class="carousel-btn carousel-prev" data-dir="-1"><span aria-hidden="true">&lsaquo;</span></button>
              <button type="button" class="carousel-btn carousel-next" data-dir="1"><span aria-hidden="true">&rsaquo;</span></button>
              <span class="carousel-count" aria-live="polite"></span>
            </div>
            <div class="course-body">
              <p class="course-label" data-i18n="courses.liveLabel"></p>
              <h3 class="course-title" data-i18n="courses.liveTitle"></h3>
              <p data-i18n="courses.liveText"></p>
              <ul class="course-list" data-i18n-list="courses.liveFacts"></ul>
              <a class="btn btn-primary" data-link="courses" data-i18n="courses.liveCta" href="#"></a>
            </div>
          </article>
          <article class="course-card">
            <img data-i18n-alt="courses.videoAlt" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 960 540%27/%3E" data-src="./assets/img/videocorsi-bodygon.jpg" alt="" loading="lazy" decoding="async" width="960" height="540" />
            <div class="course-body">
              <p class="course-label" data-i18n="courses.videoLabel"></p>
              <h3 class="course-title" data-i18n="courses.videoTitle"></h3>
              <p data-i18n="courses.videoText"></p>
              <ul class="course-list" data-i18n-list="courses.videoItems"></ul>
              <a class="btn btn-primary" data-link="videocourses" data-i18n="courses.videoCta" href="#"></a>
            </div>
          </article>
        </div>
      </section>

      <!-- STORY (narrative) -->
      <section class="section story-band" id="story">
        <p class="kicker" data-i18n="story.kicker"></p>
        <h2 class="section-title" data-i18n="story.title"></h2>
        <div class="story">
          <p class="story-lead" data-i18n-html="story.lead"></p>

          <div class="chapter">
            <div class="chapter-text">
              <h3 class="story-h" data-i18n="story.hUni"></h3>
              <p data-i18n-html="story.p0"></p>
              <figure class="story-figure story-figure-small">
                <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 472 372%27/%3E" data-src="./assets/img/myers-urbino.jpg" alt="Emanuele d'Ambrosio con Carlton Myers all'Università di Urbino" loading="lazy" decoding="async" width="472" height="372" />
                <figcaption data-i18n="story.capMyers"></figcaption>
              </figure>
            </div>
          </div>

          <div class="chapter">
            <div class="chapter-text">
              <h3 class="story-h" data-i18n="story.hThesis"></h3>
              <p data-i18n-html="story.p1"></p>
              <blockquote class="story-quote" data-i18n-html="story.quote"></blockquote>
            </div>
            <div class="chapter-media">
              <figure class="story-figure story-figure-thesis" style="--ar: 0.70">
                <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 771 1100%27/%3E" data-src="./assets/img/thesis-cover.jpg" alt="Copertina della tesi di laurea «La forza e le sue espressioni nel pugilato dilettantistico»" loading="lazy" decoding="async" width="771" height="1100" />
                <figcaption data-i18n="story.capThesis"></figcaption>
              </figure>
              <figure class="story-figure" style="--ar: 1.33">
                <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1100 825%27/%3E" data-src="./assets/img/silvaggi-2009.jpg" alt="Emanuele d'Ambrosio con il prof. Nicola Silvaggi, Urbino 2009" loading="lazy" decoding="async" width="1100" height="825" />
                <figcaption data-i18n="story.capSilvaggi"></figcaption>
              </figure>
            </div>
          </div>

          <div class="chapter">
            <div class="chapter-text">
              <h3 class="story-h" data-i18n="story.h2"></h3>
              <p data-i18n-html="story.p2"></p>
            </div>
          </div>

          <div class="chapter">
            <div class="chapter-text">
              <h3 class="story-h" data-i18n="story.h3"></h3>
              <p data-i18n-html="story.p3"></p>
            </div>
            <div class="chapter-media">
              <figure class="story-figure" style="--ar: 1.33">
                <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1080 810%27/%3E" data-src="./assets/img/gallipoli-2013-talk.jpg" alt="Emanuele d'Ambrosio relatore al raduno FPI di Gallipoli, 2013" loading="lazy" decoding="async" width="1080" height="810" />
                <figcaption data-i18n="story.capGallipoliTalk"></figcaption>
              </figure>
              <figure class="story-figure" style="--ar: 2.07">
                <button type="button" class="video-facade" data-video="./assets/media/gallipoli-2013-clip.mp4" aria-label="Play video">
                  <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 620 300%27/%3E" data-src="./assets/img/gallipoli-2013-poster.jpg" alt="Intervista a Emanuele d'Ambrosio dopo il seminario, Gallipoli 2013" loading="lazy" decoding="async" width="620" height="300" />
                  <span class="play-icon" aria-hidden="true">▶</span>
                </button>
                <figcaption data-i18n="story.capGallipoli"></figcaption>
              </figure>
            </div>
          </div>

          <div class="chapter">
            <div class="chapter-text">
              <h3 class="story-h" data-i18n="story.h4"></h3>
              <p data-i18n-html="story.p4"></p>
            </div>
          </div>

          <div class="chapter">
            <div class="chapter-text">
              <h3 class="story-h" data-i18n="story.h5"></h3>
              <p data-i18n-html="story.p5"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- ATHLETES & TEAMS (results in the field) -->
      <section class="section wins-band" id="athletes">
        <p class="kicker" data-i18n="wins.kicker"></p>
        <h2 class="section-title" data-i18n="wins.title"></h2>
        <p class="wins-lead" data-i18n-html="wins.lead"></p>

        <div class="wins">
          <article class="win">
            <div class="win-body">
              <p class="win-year" data-i18n="wins.w1y"></p>
              <h3 class="win-title" data-i18n="wins.w1t"></h3>
              <p data-i18n-html="wins.w1p"></p>
            </div>
            <figure class="win-fig win-tall">
              <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 543 1100%27/%3E" data-src="./assets/img/gela-trophy-court.jpg" alt="Emanuele d'Ambrosio e Carmelo Nuzzi con la coppa del campionato di Serie C" loading="lazy" decoding="async" width="543" height="1100" />
              <figcaption data-i18n="wins.w1cap"></figcaption>
            </figure>
            <figure class="win-fig win-detail">
              <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 438 780%27/%3E" data-src="./assets/img/gela-trophy-plate.jpg" alt="Targa della coppa: Campionato Serie C, prima classificata, 2025/2026" loading="lazy" decoding="async" width="438" height="780" />
              <figcaption data-i18n="wins.w1cap2"></figcaption>
            </figure>
          </article>

          <article class="win">
            <div class="win-body">
              <p class="win-year" data-i18n="wins.w2y"></p>
              <h3 class="win-title" data-i18n="wins.w2t"></h3>
              <p data-i18n-html="wins.w2p"></p>
            </div>
            <figure class="win-fig">
              <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 737 1000%27/%3E" data-src="./assets/img/pappalardo-belts.jpg" alt="Emanuele d'Ambrosio con Gianluca Pappalardo e le cinture del Trofeo delle Cinture Pro" loading="lazy" decoding="async" width="737" height="1000" />
              <figcaption data-i18n="wins.w2cap"></figcaption>
            </figure>
          </article>

          <article class="win">
            <div class="win-body">
              <p class="win-year" data-i18n="wins.w3y"></p>
              <h3 class="win-title" data-i18n="wins.w3t"></h3>
              <p data-i18n-html="wins.w3p1"></p>
              <p data-i18n-html="wins.w3p2"></p>
              <blockquote class="win-quote" data-i18n-html="wins.w3q"></blockquote>
            </div>
            <figure class="win-fig">
              <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1200 900%27/%3E" data-src="./assets/img/francavilla-athletes.jpg" alt="Emanuele d'Ambrosio con Giacomo Leone, Ottavio Andriani e Stefano Baldini" loading="lazy" decoding="async" width="1200" height="900" />
              <figcaption data-i18n="wins.w3cap"></figcaption>
            </figure>
          </article>
        </div>
      </section>

      <div class="section-pair section-alt">
        <!-- EDUCATION -->
        <section class="section" id="education">
          <p class="kicker" data-i18n="credentials.kicker"></p>
          <h2 class="section-title" data-i18n="credentials.title"></h2>
          <ul class="edu-list" id="education-list"></ul>
        </section>

        <!-- EXPERIENCE -->
        <section class="section" id="experience">
          <p class="kicker" data-i18n="experience.kicker"></p>
          <h2 class="section-title" data-i18n="experience.title"></h2>
          <ul class="exp-list" id="experience-list"></ul>
        </section>
      </div>

      <!-- SERVICES -->
      <section class="section" id="services">
        <p class="kicker" data-i18n="services.kicker"></p>
        <h2 class="section-title" data-i18n="services.title"></h2>
        <div class="cards">
          <article class="card"><h3 data-i18n="services.s1t"></h3><p data-i18n="services.s1d"></p></article>
          <article class="card"><h3 data-i18n="services.s2t"></h3><p data-i18n="services.s2d"></p></article>
          <article class="card"><h3 data-i18n="services.s3t"></h3><p data-i18n="services.s3d"></p></article>
          <article class="card"><h3 data-i18n="services.s4t"></h3><p data-i18n="services.s4d"></p></article>
        </div>
      </section>

      <!-- TEACHING -->
      <section class="section section-alt" id="teaching">
        <p class="kicker" data-i18n="teaching.kicker"></p>
        <h2 class="section-title" data-i18n="teaching.title"></h2>
        <ul class="bullet-list" id="teaching-list"></ul>
      </section>

      <div class="section-pair">
        <!-- CONTINUING EDUCATION -->
        <section class="section" id="cpd">
          <p class="kicker" data-i18n="cpd.kicker"></p>
          <h2 class="section-title" data-i18n="cpd.title"></h2>
          <ul class="edu-list" id="cpd-list"></ul>
        </section>

        <!-- SPORTS -->
        <section class="section" id="sports">
          <p class="kicker" data-i18n="sports.kicker"></p>
          <h2 class="section-title" data-i18n="sports.title"></h2>
          <ul class="chip-list" id="sports-list"></ul>
        </section>
      </div>

      <!-- BOOKS STUDIED -->
      <section class="section" id="books">
        <p class="kicker" data-i18n="books.kicker"></p>
        <h2 class="section-title" data-i18n="books.title"></h2>
        <p class="books-intro" data-i18n="books.intro"></p>
        <ul class="book-list" id="books-list"></ul>
      </section>

      <!-- NEWS -->
      <section class="section section-alt" id="news">
        <p class="kicker" data-i18n="news.kicker"></p>
        <h2 class="section-title" data-i18n="news.title"></h2>
        <article class="news-item">
          <h3 class="news-title" data-i18n="news.itemTitle"></h3>
          <p data-i18n="news.itemText"></p>

          <figure class="media">
            <!-- Click-to-play facade: the photo is the poster; the 18.7MB video
                 downloads only when the user clicks it. See main.js. -->
            <button type="button" class="video-facade" data-video="./assets/media/parisi-aos-clip.mp4" aria-label="Play video">
              <img
                src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1280 881%27/%3E" data-src="./assets/img/parisi-aos-course.jpg"
                alt="Anatomy of Speed, Parisi certification course"
                loading="lazy"
                decoding="async"
                width="1280"
                height="881"
              />
              <span class="play-icon" aria-hidden="true">▶</span>
            </button>
            <figcaption data-i18n="news.captionPhoto"></figcaption>
          </figure>

          <figure class="media media-portrait">
            <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 767 1200%27/%3E" data-src="./assets/img/parisi-dedication.jpg" alt="Dedica autografa di Bill Parisi" loading="lazy" decoding="async" width="767" height="1200" />
            <figcaption data-i18n="news.captionDedication"></figcaption>
          </figure>
        </article>
      </section>

      <!-- CONTACT -->
      <section class="section" id="contact">
        <p class="kicker" data-i18n="contact.kicker"></p>
        <h2 class="section-title" data-i18n="contact.title"></h2>
        <p class="contact-text" data-i18n="contact.text"></p>
        <p class="contact-where" data-i18n="contact.location"></p>
        <div class="contact-actions">
          <a class="btn btn-primary" id="contact-email" href="#" data-i18n="contact.emailLabel"></a>
          <a class="contact-address" id="contact-address" href="#"></a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-copy">© <span id="year"></span> Emanuele d'Ambrosio. <span data-i18n="footer.rights"></span></span>
    </footer>

    <script src="./assets/js/content.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
